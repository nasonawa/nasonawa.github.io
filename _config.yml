title: "[■] Modular Systems Blog"
email: nasonawa.github.io
description: >-
  I work on building, scaling, and maintaining open source infrastructure and cloud-native systems.
  With a strong passion for systems engineering, Linux, Kubernetes, and developer tooling,
  I spend my days solving complex problems at scale.
domain: "nasonawa.github.io"
url: "https://nasonawa.github.io"

# Permalinks config
permalink: /posts/:title/

# Markdown and syntax highlighting configuration
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    block:
      line_numbers: false

# Exclude lists for compilation safety
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .jekyll-cache/
  - .jekyll-metadata
